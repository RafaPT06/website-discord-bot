<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Avatar Tracker — Meowz</title>
<link rel="stylesheet" href="/css/main.css"><style>
body{background:#101218;color:#f1f3f9;font-family:system-ui,sans-serif}main{max-width:880px;margin:45px auto;padding:20px}a{color:#a5b4fc}
.panel{background:#1b1e28;border:1px solid #373b4a;border-radius:16px;padding:22px;margin:18px 0}
form,.entry{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}input,select,button{background:#262b39;color:white;border:1px solid #555b6e;border-radius:9px;padding:12px;font:inherit}input{flex:2;min-width:190px}select{flex:1;min-width:160px}button{cursor:pointer}button.primary{background:#5865f2;border-color:#5865f2}.entry{border-top:1px solid #373b4a;padding-top:14px}.entry strong{min-width:150px}small{color:#aab0c2}#message{min-height:24px}
</style></head><body><main><a id="back" href="/dashboard">← Back to server dashboard</a><h1>Roblox Avatar Tracker</h1><p>Track multiple Roblox users. Meowz checks outfits every 5 minutes and posts changes to your selected channel.</p>
<section class="panel"><h2>Add Roblox user</h2><form id="add"><input id="user" required maxlength="150" placeholder="Username, user ID or Roblox profile link"><select id="channel" required><option value="">Loading channels…</option></select><button class="primary">Add tracker</button></form></section>
<section class="panel"><h2>Tracked users</h2><div id="list">Loading…</div></section><p id="message" role="status"></p></main>
<script type="module" src="/js/dashboard-avatar-tracker.js"></script></body></html>
